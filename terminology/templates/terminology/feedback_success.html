{% extends "terminology/base.html" %}
{% load static %}

{% block title %}Feedback Submitted - InterpAscend{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body text-center">
                    <div class="text-success mb-3">
                        <svg width="32" height="32" class="mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>
                    
                    <h1 class="card-title mb-3">Thank You!</h1>
                    <p class="mb-4">Your feedback has been successfully submitted. We appreciate your input!</p>
                    
                    <div class="mt-4">
                        <a href="{% url 'terminology:translate' %}" class="btn btn-primary">
                            Return to Homepage
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
