{# terminology/templates/terminology/_search_form.html #}
<form method="get" action="{% url 'terminology:translate' %}"
      class="d-flex flex-column flex-md-row align-items-md-center mb-4">
  <div class="flex-grow-1 me-md-2 w-100 mb-2 mb-md-0">
    <input
      name="query"
      type="text"
      class="form-control"
      placeholder="e.g. 'aspirin', 'hipertensión', 'corredor de seguros'"
      value="{{ request.GET.query|default_if_none:'' }}"
    >
  </div>
  <button type="submit" class="btn btn-primary me-md-2 mb-2 mb-md-0">
    Translate
  </button>

  <div class="d-flex align-items-center">
    <label for="match_type" class="form-label me-2 mb-0">Match type:</label>
    <select id="match_type" name="match_type" onchange="this.form.submit()"
            class="form-select w-auto">
      <option value="exact"      {% if request.GET.match_type == "exact" %}selected{% endif %}>Exact match</option>
      <option value="contains"   {% if request.GET.match_type == "contains" %}selected{% endif %}>Contains</option>
      <option value="startswith" {% if request.GET.match_type == "startswith" %}selected{% endif %}>Starts with</option>
    </select>
  </div>
</form>
